<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Double Rings -->
  <circle cx="250" cy="250" r="236" fill="#0d0d10" stroke="currentColor" stroke-width="6.5"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="currentColor" stroke-width="3.5" stroke-opacity="0.95"/>
  
  <!-- Top Accent Bar -->
  <rect x="132" y="142" width="62" height="9" rx="2" fill="currentColor"/>
  
  <!-- Stylized WA Monogram -->
  <g fill="currentColor">
    <!-- W glyph with vertical drop stem and dynamic geometry -->
    <path d="M 108 165
             L 148 238
             L 148 392
             L 185 392
             L 185 272
             L 230 165
             L 268 165
             L 225 276
             L 258 276
             L 298 165
             L 264 165
             L 242 228
             L 204 165
             L 172 165
             L 142 242
             L 132 165
             Z" />

    <!-- A glyph connecting with W and right horizontal wing extension -->
    <path d="M 298 165
             L 345 165
             L 425 278
             L 452 278
             L 452 302
             L 358 302
             L 374 278
             L 388 278
             L 326 188
             L 282 290
             L 256 290
             Z" />
             
    <!-- A inner crossbar / triangular counter -->
    <polygon points="314,215 348,266 292,266" fill="#0d0d10" />
    
    <!-- Subtitle: WONDERLIGHT ADVENTURE -->
    <text x="250" y="342" 
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16.5" 
          font-weight="800" 
          letter-spacing="5.5" 
