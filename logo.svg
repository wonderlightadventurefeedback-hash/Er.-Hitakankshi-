          fill="currentColor">WONDERLIGHT ADVENTURE</text>

    <!-- Subtitle 2: EXPLORE MORE • EXPECT MORE -->
    <text x="250" y="366" 
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="4.5" 
          text-anchor="middle" 
          fill="currentColor" 
          opacity="0.85">EXPLORE MORE • EXPECT MORE</text>
